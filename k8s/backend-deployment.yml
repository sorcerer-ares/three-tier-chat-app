apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: chat-app
  labels:
    app: backend
spec:
  selector:
    matchLabels:
      app: backend
  replicas: 1
  template:
    metadata:
      name: backend-pod
      namespace: chat-app
      labels:
        app: backend
    spec:
      containers:
      - name: chatapp-backend
        image: vlawliet/chatapp-backend:latest
        command: ["/bin/sh", "-c"]
        args: ["npm install && npm run start"]
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1024Mi"
            cpu: "1000m"
        ports:
        - containerPort: 5001
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "5001"
        - name: MONGODB_URI
          value: "mongodb://mongoadmin:secret@mongodb:27017/chatApp?authSource=admin"
        - name: JWT_SECRET
          value: "X2vbfHs0hPlNjD6mPGuEXSNtxpTYMM9Cu4cCEi1l0zz"
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: 5001
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: 5001
          initialDelaySeconds: 5
          periodSeconds: 5
        restartPolicy: Always